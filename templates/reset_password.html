{% extends 'base.html' %}
{% block title %}Tạo mật khẩu mới{% endblock %}
{% block content %}
<div class="container">
  <div class="auth panel">
    <h1>Tạo mật khẩu admin mới</h1>
    {% if invalid %}
      <p class="muted">Liên kết không hợp lệ hoặc đã hết hạn. Hãy yêu cầu một liên kết mới.</p>
      <p class="center"><a href="{{url_for('password_reset.forgot_password')}}">Yêu cầu liên kết mới</a></p>
    {% else %}
      <form method="post">
        <input type="hidden" name="_csrf" value="{{csrf_token()}}">
        <label>Mật khẩu mới<input type="password" name="password" autocomplete="new-password" minlength="8" required></label>
        <label>Nhập lại mật khẩu<input type="password" name="confirm" autocomplete="new-password" minlength="8" required></label>
        <button class="cta full">Lưu mật khẩu mới</button>
      </form>
    {% endif %}
  </div>
</div>
{% endblock %}
