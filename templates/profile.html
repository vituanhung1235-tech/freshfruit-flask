{% extends 'base.html' %}{% block title %}Hồ sơ{% endblock %}{% block content %}<div class="container"><div class="page-head" style="margin: 35px 0 20px;"><h1>👤 Thông tin cá nhân</h1></div><form class="panel auth" method="post"><input type="hidden" name="_csrf" value="{{csrf_token()}}"><label>Họ và tên<input name="name" required value="{{user.name}}"></label><label>Email<input value="{{user.email}}" disabled></label><label>Số điện thoại<input name="phone" value="{{user.phone}}"></label><label>Địa chỉ<textarea name="address">{{user.address}}</textarea></label><button class="cta full">Lưu thay đổi</button></form></div>{% endblock %}
