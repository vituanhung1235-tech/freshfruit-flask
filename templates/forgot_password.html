{% extends 'base.html' %}
{% block title %}Quên mật khẩu{% endblock %}
{% block content %}
<div class="container">
  <div class="auth panel">
    <h1>Đặt lại mật khẩu admin</h1>
    <p class="muted">Nhập email quản trị để nhận liên kết đặt mật khẩu mới.</p>
    <form method="post">
      <input type="hidden" name="_csrf" value="{{csrf_token()}}">
      <label>Email<input type="email" name="email" autocomplete="email" required></label>
      <button class="cta full">Gửi liên kết đặt lại</button>
    </form>
    <p class="center"><a href="{{url_for('login')}}">Quay lại đăng nhập</a></p>
  </div>
</div>
{% endblock %}
