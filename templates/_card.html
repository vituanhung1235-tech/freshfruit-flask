<div class="product-card"><a href="{{url_for('product',pid=p.id)}}" class="fruit-visual">{% if p.image %}<img src="{{p.image}}" alt="{{p.name}}" class="fruit-img" loading="lazy" onerror="this.style.display='none';this.nextElementSibling.style.display='inline-block';"><span class="fruit-fallback" style="display:none;">{{p.emoji}}</span>{% else %}<span>{{p.emoji}}</span>{% endif %}</a><div class="card-body"><small>{{p.category}}</small><a class="prod-name" href="{{url_for('product',pid=p.id)}}">{{p.name}}</a><div class="price">{{money(p.price)}} <span>/{{p.unit}}</span></div><div class="stock">{% if p.stock>0 %}✓ Còn {{p.stock}} {{p.unit}}{% else %}Hết hàng{% endif %}</div><a class="add-btn" href="{{url_for('product',pid=p.id)}}">Xem & mua hàng →</a></div></div>
